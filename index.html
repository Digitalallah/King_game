<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Кинг</title>
    <link rel="stylesheet" href="./src/styles.css?v=single-player-1" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="game-viewport" aria-label="Оригинальная игра Кинг">
        <div id="gameStage" class="game-stage">
          <canvas
            id="gameCanvas"
            width="640"
            height="350"
            tabindex="0"
            aria-label="Игровое поле. Нажимайте на персонажей и карты."
          ></canvas>

          <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite">
            <div class="loading-window">
              <strong>КИНГ</strong>
              <span id="loadingText">Запускаем оригинальную игру…</span>
              <span class="loading-bar" aria-hidden="true"><i id="loadingBar"></i></span>
              <button id="retryButton" type="button" hidden>Повторить запуск</button>
            </div>
          </div>
        </div>
      </section>

      <footer class="game-controls">
        <p id="gameHint">После загрузки выберите трёх партнёров, затем игра начнётся автоматически.</p>
        <div class="control-buttons">
          <button id="restartButton" type="button">Начать заново</button>
          <button id="zoomButton" type="button" aria-pressed="false">Масштаб 1:1</button>
          <button id="fullscreenButton" type="button">На весь экран</button>
        </div>
      </footer>
    </main>

    <script src="./vendor/emulators/emulators.js?v=8.4.1"></script>
    <script type="module" src="./src/single-player.js?v=single-player-1"></script>
  </body>
</html>
